<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mezuniyet 2025-2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0618;font-family:'Georgia',serif;}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block;}
#hud{position:fixed;top:0;left:0;width:100%;text-align:center;z-index:10;pointer-events:none;}
#school{margin-top:14px;font-size:clamp(.6em,.9vw,.82em);color:#8899cc;letter-spacing:.18em;}
#title{font-size:clamp(1.5em,5vw,2.8em);font-weight:bold;color:#FFD700;letter-spacing:.06em;text-shadow:0 0 28px #FFD70055;margin-top:4px;line-height:1.1;}
#hint{font-size:clamp(.65em,2vw,.8em);color:rgba(255,255,255,.38);margin-top:5px;letter-spacing:.1em;}
#btns{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:20;}
.cbtn{padding:8px 18px;border:1.5px solid #ffffff44;border-radius:20px;color:#ccd;font-size:clamp(.72em,2.2vw,.88em);cursor:pointer;background:rgba(255,255,255,.07);transition:all .2s;letter-spacing:.08em;white-space:nowrap;-webkit-user-select:none;user-select:none;}
.cbtn.on{background:rgba(255,215,0,.22);border-color:#FFD700;color:#FFD700;font-weight:bold;}
#footer{position:fixed;bottom:5px;width:100%;text-align:center;color:rgba(255,255,255,.2);font-size:clamp(.6em,1.6vw,.7em);letter-spacing:.15em;z-index:10;pointer-events:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="school">TAHİR KAYA İMAM HATİP ORTAOKULU</div>
  <div id="title">🎓 MEZUNİYET 2025–2026 🎓</div>
  <div id="hint">Balonlara dokun — patlasın! 🎈</div>
</div>
<div id="btns">
  <div class="cbtn on" onclick="filterClass(0)">Tümü</div>
  <div class="cbtn" onclick="filterClass(1)">8 / A</div>
  <div class="cbtn" onclick="filterClass(2)">8 / B</div>
  <div class="cbtn" onclick="filterClass(3)">8 / C</div>
</div>
<div id="footer">✦ Hayırlı olsun sevgili mezunlar (Ali AKDOĞAN) ✦</div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let CW,CH;
function resize(){
  CW=canvas.width=window.innerWidth;
  CH=canvas.height=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

const ALL=[
  {n:'Beyza Fazlı',c:1},{n:'Ebrar Sultan Sakarya',c:1},{n:'Eylül Çelebi',c:1},
  {n:'Ecrin Elif Savaş',c:1},{n:'Güzide Aslı Doğan',c:1},{n:'Merve Şevval Aslanhan',c:1},
  {n:'Miraç Nur Çötenoğlu',c:1},{n:'Nehir Ünsal',c:1},{n:'Rojin Çakar',c:1},
  {n:'Tuğba Özer',c:1},{n:'Zeynep Özyürek',c:1},{n:'İrem Lütfiye Nalbat',c:1},
  {n:'Betül Aydoğmuş',c:1},{n:'Vildan Kırlak',c:1},{n:'Rawan Almustafa',c:1},
  {n:'Medine Keleş',c:1},{n:'Ada Çelik',c:1},{n:'Elif Nur Siviş',c:1},
  {n:'Sevde Nur Mutlu',c:1},{n:'Yağmur Ecrin Damgacı',c:1},{n:'Hayrünnisa Polat',c:1},
  {n:'Rümeysa Koç',c:1},{n:'Ümmügülsüm Karaaslan',c:1},{n:'Gülsüm Çankal',c:1},
  {n:'Sümeyye Öztürk',c:1},{n:'Aylin Meral',c:1},{n:'Ayşenaz Işık',c:1},
  {n:'Zeynep Ecrin Şeker',c:1},{n:'Hiranur Umut',c:1},{n:'Ravza Zeynep Portakal',c:1},
  {n:'Ebrar Irmak',c:1},{n:'İmran Karakaş',c:1},
  {n:'Hamza Hammuş',c:2},{n:'Yusuf Emir Korkmaz',c:2},{n:'Yusuf Yemişli',c:2},
  {n:'Memiş Yoldaş',c:2},{n:'Mevlüt Agridağı',c:2},{n:'Berat Kanbur',c:2},
  {n:'Muhammed Fatih Altunbay',c:2},{n:'Muhammed Yusuf Erden',c:2},{n:'Sefa Duman',c:2},
  {n:'Devran Karaaslan',c:2},{n:'Ahmet İlhan Demir',c:2},{n:'Mohamad Ghaith Koshkar',c:2},
  {n:'Muhammed Yasin Oğuz',c:2},
  {n:'Asel Ada Gokmen',c:3},{n:'Duru Köseoğlu',c:3},{n:'Elif Saliha Söğütcü',c:3},
  {n:'İrem Ece Uçar',c:3},{n:'Tusem Uğurlu',c:3},{n:'Zehra Eroğlu',c:3},
  {n:'Anıl Kayra Akpınar',c:3},{n:'Giray Yıldız',c:3},{n:'Mesut Taş',c:3},
  {n:'Haktan Tayfun Tarhan',c:3},{n:'Zeynep Hazal Özdemir',c:3},{n:'Selim Yartaşı',c:3},
  {n:'Yavuz Efe Çolak',c:3},{n:'Yakup Gezer',c:3},{n:'Yusuf Gezer',c:3},
  {n:'Ecrin Nisanur Yılmaz',c:3},{n:'Elif Naz Özgün',c:3},{n:'Zehra Pınar Karaca',c:3},
  {n:'İlknur Gedik',c:3}
];

const PAL=[
  ['#FF6B9D','#FF8E53','#FFD93D','#6BCB77','#4D96FF','#C77DFF','#FF6B6B','#48CAE4','#F8A5C2','#A8E6CF'],
  ['#FF4D6D','#FF758C','#FF8FA3','#FFB3C1','#FFCCD5','#FF6B9D','#E63946'],
  ['#4361EE','#4CC9F0','#7209B7','#3A0CA3','#560BAD','#48CAE4','#4895EF'],
  ['#2DC653','#80ED99','#57CC99','#22577A','#38A3A5','#52B788','#74C69D']
];

let balloons=[],particles=[],nameLabels=[],confetti=[],stars=[];

for(let i=0;i<110;i++) stars.push({x:Math.random(),y:Math.random()*.7,r:Math.random()*1.4+.3,t:Math.random()*Math.PI*2,s:Math.random()*.035+.007});

function lighten(hex,amt){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,Math.round(r+(255-r)*amt))},${Math.min(255,Math.round(g+(255-g)*amt))},${Math.min(255,Math.round(b+(255-b)*amt))})`;
}
function darken(hex,amt){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.round(r*(1-amt))},${Math.round(g*(1-amt))},${Math.round(b*(1-amt))})`;
}

function isMobile(){return Math.min(CW,CH)<600;}

function makeBalloon(s,idx,total){
  const pal=PAL[s.c];
  const col=pal[Math.floor(Math.random()*pal.length)];
  const mobile=isMobile();
  const minR=mobile?28:34, maxR=mobile?18:22;
  const r=minR+Math.random()*maxR;
  const cols=Math.max(3,Math.ceil(Math.sqrt(total)));
  const c2=idx%cols;
  const startX=(c2+.5)*(CW/cols)+(Math.random()*40-20);
  const row=Math.floor(idx/cols);
  return {
    x:Math.max(r+5,Math.min(CW-r-5,startX)),
    y:CH+r+row*90+Math.random()*50,
    vy:-(mobile?.45+Math.random()*.4:.5+Math.random()*.45),
    vx:(Math.random()-.5)*.5,
    sway:Math.random()*Math.PI*2,
    swaySpd:.01+Math.random()*.012,
    r,col,name:s.n,cls:s.c,
    popped:false,popAlpha:1,
    born:performance.now(),delay:idx*110
  };
}

function init(filter){
  balloons=[];nameLabels=[];particles=[];confetti=[];
  const list=filter===0?ALL:ALL.filter(s=>s.c===filter);
  list.forEach((s,i)=>balloons.push(makeBalloon(s,i,list.length)));
}
init(0);

window.filterClass=function(f){
  document.querySelectorAll('.cbtn').forEach((b,i)=>b.classList.toggle('on',i===f));
  init(f);
};

function popBalloon(b){
  if(b.popped)return;
  b.popped=true;
  const mobile=isMobile();
  const count=mobile?22:30;
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,spd=2+Math.random()*5;
    particles.push({x:b.x,y:b.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-2,r:2.5+Math.random()*4.5,color:b.col,life:1,decay:.016+Math.random()*.012,rot:Math.random()*Math.PI*2,rotv:(Math.random()-.5)*.2});
  }
  for(let i=0;i<(mobile?8:12);i++){
    confetti.push({x:b.x,y:b.y,vx:(Math.random()-.5)*10,vy:-(Math.random()*6+3),color:PAL[0][Math.floor(Math.random()*PAL[0].length)],w:7+Math.random()*9,h:3+Math.random()*5,rot:Math.random()*Math.PI*2,rotv:(Math.random()-.5)*.3,life:1,decay:.009});
  }
  nameLabels.push({
    name:b.name,x:b.x,y:b.y-b.r,
    vx:(Math.random()-.5)*.8,vy:-(1.4+Math.random()*.8),
    life:1,decay:.0045,
    size:Math.max(mobile?13:14,Math.min(b.r*.36,mobile?17:20)),
    col:b.col
  });
}

function getPos(e){
  const rect=canvas.getBoundingClientRect();
  const scaleX=CW/rect.width, scaleY=CH/rect.height;
  if(e.touches&&e.touches.length>0){
    return {x:(e.touches[0].clientX-rect.left)*scaleX,y:(e.touches[0].clientY-rect.top)*scaleY};
  }
  return {x:(e.clientX-rect.left)*scaleX,y:(e.clientY-rect.top)*scaleY};
}

function handleTap(e){
  e.preventDefault();
  const {x,y}=getPos(e);
  let hit=false;
  for(const b of balloons){
    if(b.popped)continue;
    const dx=b.x-x,dy=b.y-y;
    if(Math.sqrt(dx*dx+dy*dy)<b.r+14){popBalloon(b);hit=true;break;}
  }
}

canvas.addEventListener('click',handleTap);
canvas.addEventListener('touchstart',handleTap,{passive:false});
canvas.addEventListener('mousemove',e=>{
  const {x,y}=getPos(e);
  let hit=false;
  for(const b of balloons){if(!b.popped){const dx=b.x-x,dy=b.y-y;if(Math.sqrt(dx*dx+dy*dy)<b.r+12){hit=true;break;}}}
  canvas.style.cursor=hit?'pointer':'default';
});

setInterval(()=>{
  const live=balloons.filter(b=>!b.popped&&b.y<CH+80&&b.y>-50);
  if(live.length>0)popBalloon(live[Math.floor(Math.random()*Math.min(live.length,4))]);
},1100);

function draw(now){
  requestAnimationFrame(draw);
  ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle='#0a0618';
  ctx.fillRect(0,0,CW,CH);

  for(const s of stars){
    s.t+=s.s;
    ctx.save();ctx.globalAlpha=.2+.75*(0.5+0.5*Math.sin(s.t));
    ctx.fillStyle='#fff';ctx.beginPath();
    ctx.arc(s.x*CW,s.y*CH,s.r,0,Math.PI*2);ctx.fill();ctx.restore();
  }

  for(const b of balloons){
    if(b.delay&&now-b.born<b.delay)continue;
    if(b.popped){
      b.popAlpha-=.013;
      if(b.popAlpha<=0)continue;
      ctx.save();ctx.globalAlpha=b.popAlpha*.3;ctx.strokeStyle=b.col;ctx.lineWidth=1.5;
      for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2;ctx.beginPath();ctx.moveTo(b.x+Math.cos(a)*b.r*.8,b.y+Math.sin(a)*b.r*.8);ctx.lineTo(b.x+Math.cos(a)*b.r*1.55,b.y+Math.sin(a)*b.r*1.55);ctx.stroke();}
      ctx.restore();continue;
    }
    b.sway+=b.swaySpd;
    b.x+=b.vx+Math.sin(b.sway)*.45;
    b.y+=b.vy;
    if(b.x<b.r+2)b.vx=Math.abs(b.vx);
    if(b.x>CW-b.r-2)b.vx=-Math.abs(b.vx);
    if(b.y<-b.r*5){b.y=CH+b.r+Math.random()*120;b.x=Math.max(b.r+5,Math.min(CW-b.r-5,Math.random()*CW));}

    ctx.save();
    const g=ctx.createRadialGradient(b.x-b.r*.3,b.y-b.r*.35,b.r*.05,b.x,b.y,b.r);
    g.addColorStop(0,lighten(b.col,.62));g.addColorStop(.5,b.col);g.addColorStop(1,darken(b.col,.42));
    ctx.beginPath();ctx.ellipse(b.x,b.y,b.r,b.r*1.18,0,0,Math.PI*2);
    ctx.fillStyle=g;ctx.fill();

    ctx.beginPath();ctx.ellipse(b.x-b.r*.26,b.y-b.r*.32,b.r*.2,b.r*.14,-.4,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.46)';ctx.fill();

    ctx.beginPath();
    let sx=b.x,sy=b.y+b.r*1.18;
    ctx.moveTo(sx,sy);
    for(let i=1;i<=14;i++){const ti=i*.45;ctx.lineTo(sx+Math.sin(ti+b.sway*.5)*5,sy+ti*6);}
    ctx.strokeStyle=darken(b.col,.25);ctx.lineWidth=1.2;ctx.globalAlpha=.65;ctx.stroke();

    ctx.globalAlpha=1;
    const first=b.name.split(' ')[0];
    const fs=Math.max(10,Math.min(b.r*.3,13));
    ctx.font=`bold ${fs}px Georgia`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=3;ctx.strokeText(first,b.x,b.y);
    ctx.fillStyle='#fff';ctx.fillText(first,b.x,b.y);
    ctx.restore();
  }

  for(const p of particles){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life-=p.decay;p.rot+=p.rotv;
    if(p.life<=0)continue;
    ctx.save();ctx.globalAlpha=p.life;ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  particles=particles.filter(p=>p.life>0);

  for(const cf of confetti){
    cf.x+=cf.vx;cf.y+=cf.vy;cf.vy+=.12;cf.rot+=cf.rotv;cf.life-=cf.decay;
    if(cf.life<=0)continue;
    ctx.save();ctx.globalAlpha=cf.life;ctx.translate(cf.x,cf.y);ctx.rotate(cf.rot);
    ctx.fillStyle=cf.color;ctx.fillRect(-cf.w/2,-cf.h/2,cf.w,cf.h);ctx.restore();
  }
  confetti=confetti.filter(cf=>cf.life>0);

  for(const nl of nameLabels){
    nl.x+=nl.vx;nl.y+=nl.vy;nl.vy+=.018;nl.life-=nl.decay;
    if(nl.life<=0)continue;
    ctx.save();ctx.globalAlpha=Math.min(nl.life*2.2,1);
    ctx.font=`bold ${nl.size}px Georgia`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.strokeStyle='rgba(0,0,0,.92)';ctx.lineWidth=4;ctx.strokeText(nl.name,nl.x,nl.y);
    ctx.fillStyle=nl.col;ctx.fillText(nl.name,nl.x,nl.y);ctx.restore();
  }
  nameLabels=nameLabels.filter(nl=>nl.life>0);
}
requestAnimationFrame(draw);
</script>
</body>
</html>

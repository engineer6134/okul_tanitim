<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎓 Mezuniyet 2025-2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Poppins',sans-serif;background:#021b13;}

body{
  background:
    radial-gradient(circle at top left, #1b5e20 0%, transparent 35%),
    radial-gradient(circle at bottom right, #004d40 0%, transparent 35%),
    linear-gradient(135deg, #021b13, #063b2d, #0b5d48);
  min-height:100vh;
}

/* ⭐ Yıldızlar */
.stars{
  position:fixed; width:100%; height:100%; top:0; left:0;
  overflow:hidden; z-index:0; pointer-events:none;
}
.star{
  position:absolute; width:4px; height:4px; background:#fff;
  border-radius:50%; animation:twinkle 3s infinite;
}
@keyframes twinkle{
  0%,100%{opacity:.2;transform:scale(.7);}
  50%{opacity:1;transform:scale(1.6);}
}

/* 🎈 Canvas */
#c{
  position:fixed; top:0; left:0; width:100%; height:100%;
  z-index:1; display:block;
  pointer-events:auto;
}

/* 📌 HUD */
#hud{
  position:fixed; top:0; left:0; width:100%; text-align:center;
  z-index:10; pointer-events:none;
  padding-top:18px;
}
#school{
  font-size:clamp(.65em,1.1vw,.9em);
  color:#a5d6a7; letter-spacing:.18em;
  text-shadow:0 0 20px rgba(100,200,120,.3);
  font-weight:600;
}
#title{
  font-size:clamp(1.8em,5.5vw,3.2em);
  font-weight:800;
  background:linear-gradient(135deg,#ffd54f,#ffb300,#ff8f00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 30px rgba(255,193,7,.5));
  letter-spacing:.04em; margin-top:2px; line-height:1.2;
}
#hint{
  font-size:clamp(.7em,2vw,.85em);
  color:rgba(255,255,255,.5);
  margin-top:6px; letter-spacing:.12em;
  text-shadow:0 0 15px rgba(255,255,255,.1);
}

/* 🎯 Sınıf Butonları */
#btns{
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
  display:flex; gap:12px; z-index:20;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(14px);
  padding:10px 20px;
  border-radius:60px;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 8px 30px rgba(0,0,0,.5);
  flex-wrap:nowrap;
}
.cbtn{
  padding:8px 22px;
  border:1.5px solid rgba(255,255,255,.12);
  border-radius:40px;
  color:#c8d0e6;
  font-size:clamp(.7em,2.2vw,.9em);
  cursor:pointer;
  background:rgba(255,255,255,.04);
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  letter-spacing:.08em;
  white-space:nowrap;
  -webkit-user-select:none;user-select:none;
  font-weight:600;
  text-shadow:0 0 8px rgba(0,0,0,.5);
  font-family:'Poppins',sans-serif;
}
.cbtn:hover{transform:scale(1.05);border-color:rgba(255,215,0,.4);}
.cbtn.on{
  background:linear-gradient(135deg,#ffd54f,#ffb300);
  border-color:#ffd54f;
  color:#1b1b1b;
  box-shadow:0 0 40px rgba(255,193,7,.3);
  font-weight:bold;
  text-shadow:none;
}
.cbtn.on:nth-child(2){
  background:linear-gradient(135deg,#66bb6a,#2e7d32);
  border-color:#66bb6a;
  box-shadow:0 0 40px rgba(102,187,106,.3);
  color:#fff;
}
.cbtn.on:nth-child(3){
  background:linear-gradient(135deg,#4dd0e1,#00838f);
  border-color:#4dd0e1;
  box-shadow:0 0 40px rgba(77,208,225,.3);
  color:#fff;
}
.cbtn.on:nth-child(4){
  background:linear-gradient(135deg,#ff8a65,#d84315);
  border-color:#ff8a65;
  box-shadow:0 0 40px rgba(255,138,101,.3);
  color:#fff;
}

/* 📌 Alt Bilgi */
#footer{
  position:fixed; bottom:6px; width:100%;
  text-align:center;
  color:rgba(255,255,255,.12);
  font-size:clamp(.55em,1.4vw,.65em);
  letter-spacing:.2em;
  z-index:10; pointer-events:none;
  font-weight:300;
}

/* 🎵 Görünmez müzik oynatıcı - hiçbir yerde görünmez */
#hidden-audio {
  display: none !important;
  position: absolute;
  width: 0;
  height: 0;
  opacity: 0;
  pointer-events: none;
}

/* ─── MOBİL ─── */
@media(max-width:640px){
  #btns{ padding:6px 12px; gap:6px; bottom:22px; }
  .cbtn{ padding:5px 12px; font-size:.65rem; letter-spacing:.04em; }
  #hud{ padding-top:12px; }
  #school{ font-size:.6rem; }
  #title{ font-size:1.6rem; }
  #hint{ font-size:.6rem; }
}
@media(max-width:420px){
  #btns{ padding:4px 8px; gap:4px; bottom:18px; }
  .cbtn{ padding:4px 8px; font-size:.55rem; }
  #title{ font-size:1.3rem; }
}
</style>
</head>
<body>

<!-- ⭐ Yıldızlar -->
<div class="stars" id="stars"></div>

<!-- 🎈 Canvas -->
<canvas id="c"></canvas>

<!-- 📌 HUD -->
<div id="hud">
  <div id="school">✦ TAHİR KAYA İMAM HATİP ORTAOKULU ✦</div>
  <div id="title">🎓 MEZUNİYET 2025–2026 🎓</div>
  <div id="hint">✨ Balonlara dokun — isimler uçsun, konfetiler patlasın! ✨</div>
</div>

<!-- 🎵 Görünmez Müzik (otomatik çalar, hiçbir arayüz yok) -->
<audio id="bgMusic" autoplay muted loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- 🎯 Sınıf Butonları -->
<div id="btns">
  <div class="cbtn on" onclick="filterClass(0)">Tümü</div>
  <div class="cbtn" onclick="filterClass(1)">8 / A</div>
  <div class="cbtn" onclick="filterClass(2)">8 / B</div>
  <div class="cbtn" onclick="filterClass(3)">8 / C</div>
</div>

<div id="footer">✦ Hayırlı olsun sevgili mezunlar (Ali AKDOĞAN) ✦</div>

<script>
  const music = document.getElementById("bgMusic");

window.addEventListener("load", () => {
    music.play();

    document.body.addEventListener("click", () => {
        music.muted = false;
        music.play();
    }, { once: true });
});
// ================================================================
//  CANVAS KURULUMU
// ================================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let CW, CH;
function resize(){
  CW = canvas.width = window.innerWidth;
  CH = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ================================================================
//  ÖĞRENCİ LİSTESİ
// ================================================================
const ALL = [
  {n:'Beyza Fazlı',c:1},{n:'Ebrar Sultan Sakarya',c:1},{n:'Eylül Çelebi',c:1},
  {n:'Ecrin Elif Savaş',c:1},{n:'Güzide Aslı Doğan',c:1},{n:'Merve Şevval Aslanhan',c:1},
  {n:'Miraç Nur Çötenoğlu',c:1},{n:'Nehir Ünsal',c:1},{n:'Rojin Çakar',c:1},
  {n:'Tuğba Özer',c:1},{n:'Zeynep Özyürek',c:1},{n:'İrem Lütfiye Nalbat',c:1},
  {n:'Betül Aydoğmuş',c:1},{n:'Vildan Kırlak',c:1},{n:'Rawan Almustafa',c:1},
  {n:'Medine Keleş',c:1},{n:'Ada Çelik',c:1},{n:'Elif Nur Siviş',c:1},
  {n:'Sevde Nur Mutlu',c:1},{n:'Yağmur Ecrin Damgacı',c:1},{n:'Hayrünnisa Polat',c:1},
  {n:'Rümeysa Koç',c:1},{n:'Ümmügülsüm Karaaslan',c:1},{n:'Gülsüm Çankal',c:1},
  {n:'Sümeyye Öztürk',c:1},{n:'Aylin Meral',c:1},{n:'Ayşenaz Işık',c:1},
  {n:'Zeynep Ecrin Şeker',c:1},{n:'Hiranur Umut',c:1},{n:'Ravza Zeynep Portakal',c:1},
  {n:'Ebrar Irmak',c:1},{n:'İmran Karakaş',c:1},
  {n:'Hamza Hammuş',c:2},{n:'Yusuf Emir Korkmaz',c:2},{n:'Yusuf Yemişli',c:2},
  {n:'Memiş Yoldaş',c:2},{n:'Mevlüt Agridağı',c:2},{n:'Berat Kanbur',c:2},
  {n:'Muhammed Fatih Altunbay',c:2},{n:'Muhammed Yusuf Erden',c:2},{n:'Sefa Duman',c:2},
  {n:'Devran Karaaslan',c:2},{n:'Ahmet İlhan Demir',c:2},{n:'Mohamad Ghaith Koshkar',c:2},
  {n:'Muhammed Yasin Oğuz',c:2},
  {n:'Asel Ada Gokmen',c:3},{n:'Duru Köseoğlu',c:3},{n:'Elif Saliha Söğütcü',c:3},
  {n:'İrem Ece Uçar',c:3},{n:'Tusem Uğurlu',c:3},{n:'Zehra Eroğlu',c:3},
  {n:'Anıl Kayra Akpınar',c:3},{n:'Giray Yıldız',c:3},{n:'Mesut Taş',c:3},
  {n:'Haktan Tayfun Tarhan',c:3},{n:'Zeynep Hazal Özdemir',c:3},{n:'Selim Yartaşı',c:3},
  {n:'Yavuz Efe Çolak',c:3},{n:'Yakup Gezer',c:3},{n:'Yusuf Gezer',c:3},
  {n:'Ecrin Nisanur Yılmaz',c:3},{n:'Elif Naz Özgün',c:3},{n:'Zehra Pınar Karaca',c:3},
  {n:'İlknur Gedik',c:3}
];

// ================================================================
//  RENK PALETLERİ
// ================================================================
const PAL = [
  ['#FFD700','#FF6B6B','#4DD0E1','#81C784','#FF8A65','#CE93D8','#FFF176','#4FC3F7','#FFB74D','#A5D6A7'],
  ['#FFD54F','#FFB300','#FF8F00','#FFA726','#66BB6A','#43A047','#2E7D32','#FFAB91','#FF8A65','#A5D6A7'],
  ['#4DD0E1','#26C6DA','#00BCD4','#00838F','#4DB6AC','#26A69A','#2E7D32','#80CBC4','#B2DFDB','#81C784'],
  ['#FF8A65','#FF7043','#F4511E','#D84315','#EF5350','#E53935','#EC407A','#F48FB1','#FFAB91','#FF6B6B']
];

function lighten(hex,amt){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,Math.round(r+(255-r)*amt))},${Math.min(255,Math.round(g+(255-g)*amt))},${Math.min(255,Math.round(b+(255-b)*amt))})`;
}
function darken(hex,amt){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.round(r*(1-amt))},${Math.round(g*(1-amt))},${Math.round(b*(1-amt))})`;
}
function isMobile(){return Math.min(CW,CH)<600;}

// ================================================================
//  BALON, PARTİKÜL, KONFETİ, YILDIZ LİSTELERİ
// ================================================================
let balloons=[], particles=[], nameLabels=[], confetti=[], stars=[];

for(let i=0;i<160;i++){
  stars.push({
    x:Math.random(), y:Math.random()*0.8,
    r:Math.random()*2.2+0.4,
    t:Math.random()*Math.PI*2,
    s:Math.random()*0.035+0.008
  });
}

// ================================================================
//  BALON OLUŞTUR
// ================================================================
function makeBalloon(s, idx, total){
  const pal = PAL[s.c];
  const col = pal[Math.floor(Math.random()*pal.length)];
  const mobile = isMobile();
  const minR = mobile?28:36, maxR = mobile?18:24;
  const r = minR + Math.random()*maxR;
  const cols = Math.max(3, Math.ceil(Math.sqrt(total)));
  const c2 = idx % cols;
  const startX = (c2+0.5)*(CW/cols) + (Math.random()*50-25);
  const row = Math.floor(idx/cols);
  return {
    x: Math.max(r+5, Math.min(CW-r-5, startX)),
    y: CH + r + row*100 + Math.random()*60,
    vy: -(mobile?0.45+Math.random()*0.45 : 0.55+Math.random()*0.5),
    vx: (Math.random()-0.5)*0.6,
    sway: Math.random()*Math.PI*2,
    swaySpd: 0.012+Math.random()*0.014,
    r, col, name: s.n, cls: s.c,
    popped: false, popAlpha: 1,
    born: performance.now(), delay: idx*90
  };
}

function init(filter){
  balloons=[]; nameLabels=[]; particles=[]; confetti=[];
  const list = filter===0 ? ALL : ALL.filter(s=>s.c===filter);
  list.forEach((s,i)=>balloons.push(makeBalloon(s,i,list.length)));
}
init(0);

window.filterClass = function(f){
  document.querySelectorAll('.cbtn').forEach((b,i)=>b.classList.toggle('on', i===f));
  init(f);
};

// ================================================================
//  PATLATMA
// ================================================================
function popBalloon(b){
  if(b.popped) return;
  b.popped = true;

  const mobile = isMobile();
  const count = mobile?28:38;
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, spd=2.5+Math.random()*6;
    particles.push({
      x:b.x, y:b.y,
      vx:Math.cos(a)*spd, vy:Math.sin(a)*spd-2.5,
      r:2.8+Math.random()*5.5,
      color:b.col, life:1, decay:0.015+Math.random()*0.015,
      rot:Math.random()*Math.PI*2, rotv:(Math.random()-0.5)*0.25
    });
  }
  for(let i=0;i<(mobile?12:18);i++){
    confetti.push({
      x:b.x, y:b.y,
      vx:(Math.random()-0.5)*12, vy:-(Math.random()*8+4),
      color:PAL[0][Math.floor(Math.random()*PAL[0].length)],
      w:8+Math.random()*12, h:4+Math.random()*6,
      rot:Math.random()*Math.PI*2, rotv:(Math.random()-0.5)*0.4,
      life:1, decay:0.008
    });
  }
  nameLabels.push({
    name:b.name, x:b.x, y:b.y-b.r,
    vx:(Math.random()-0.5)*1.2, vy:-(1.8+Math.random()*1.2),
    life:1, decay:0.0042,
    size:Math.max(mobile?16:18, Math.min(b.r*0.4, mobile?20:26)),
    col:b.col
  });
}

// ================================================================
//  DOKUNMA / TIKLAMA
// ================================================================
function getPos(e){
  const rect = canvas.getBoundingClientRect();
  const scaleX = CW/rect.width, scaleY = CH/rect.height;
  if(e.touches && e.touches.length>0){
    return {x:(e.touches[0].clientX-rect.left)*scaleX, y:(e.touches[0].clientY-rect.top)*scaleY};
  }
  return {x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY};
}

function handleTap(e){
  e.preventDefault();
  const {x,y} = getPos(e);

  // 🔇 Müzik otomatik çalmadıysa, ilk tıklamada başlat (görünmez)
  const audio = document.getElementById('hidden-audio');
  if(audio && audio.paused){
    audio.play().catch(()=>{});
  }

  for(const b of balloons){
    if(b.popped) continue;
    const dx=b.x-x, dy=b.y-y;
    if(Math.sqrt(dx*dx+dy*dy) < b.r+16){
      popBalloon(b);
      break;
    }
  }
}

canvas.addEventListener('click', handleTap);
canvas.addEventListener('touchstart', handleTap, {passive:false});
canvas.addEventListener('mousemove', e=>{
  const {x,y}=getPos(e);
  let hit=false;
  for(const b of balloons){
    if(!b.popped){
      const dx=b.x-x, dy=b.y-y;
      if(Math.sqrt(dx*dx+dy*dy) < b.r+14){ hit=true; break; }
    }
  }
  canvas.style.cursor = hit ? 'pointer' : 'default';
});

// ================================================================
//  OTOMATİK PATLATMA
// ================================================================
setInterval(()=>{
  const live = balloons.filter(b => 
    !b.popped && 
    b.y < CH - 150 &&
    b.y > 60
  );
  if(live.length>0){
    const sorted = live.sort((a,b) => a.y - b.y);
    const candidates = sorted.slice(0, Math.min(3, sorted.length));
    const target = candidates[Math.floor(Math.random() * candidates.length)];
    if(target) popBalloon(target);
  }
}, 1600);

// ================================================================
//  🎨 ÇİZİM DÖNGÜSÜ
// ================================================================
function draw(now){
  requestAnimationFrame(draw);

  const grad = ctx.createRadialGradient(CW*0.5, CH*1.2, 0, CW*0.5, CH*1.2, CH*1.5);
  grad.addColorStop(0, '#1b5e20');
  grad.addColorStop(0.3, '#0d3d24');
  grad.addColorStop(0.7, '#063b2d');
  grad.addColorStop(1, '#021b13');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,CW,CH);

  for(const s of stars){
    s.t += s.s;
    const alpha = 0.3 + 0.7*(0.5+0.5*Math.sin(s.t));
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = 'rgba(255,215,0,0.6)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x*CW, s.y*CH, s.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  for(const b of balloons){
    if(b.delay && now-b.born < b.delay) continue;
    if(b.popped){
      b.popAlpha -= 0.015;
      if(b.popAlpha <= 0) continue;
      ctx.save();
      ctx.globalAlpha = b.popAlpha * 0.4;
      ctx.shadowColor = b.col;
      ctx.shadowBlur = 25;
      ctx.strokeStyle = b.col;
      ctx.lineWidth = 2;
      for(let i=0;i<10;i++){
        const a = (i/10)*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(b.x+Math.cos(a)*b.r*0.7, b.y+Math.sin(a)*b.r*0.7);
        ctx.lineTo(b.x+Math.cos(a)*b.r*1.8, b.y+Math.sin(a)*b.r*1.8);
        ctx.stroke();
      }
      ctx.restore();
      continue;
    }
    b.sway += b.swaySpd;
    b.x += b.vx + Math.sin(b.sway)*0.55;
    b.y += b.vy;
    if(b.x < b.r+2) b.vx = Math.abs(b.vx);
    if(b.x > CW-b.r-2) b.vx = -Math.abs(b.vx);
    if(b.y < -b.r*6){
      b.y = CH + b.r + Math.random()*150;
      b.x = Math.max(b.r+5, Math.min(CW-b.r-5, Math.random()*CW));
    }

    ctx.save();
    ctx.shadowColor = '#FFD54F';
    ctx.shadowBlur = 20;
    const g = ctx.createRadialGradient(
      b.x-b.r*0.3, b.y-b.r*0.35, b.r*0.05,
      b.x, b.y, b.r
    );
    g.addColorStop(0, lighten(b.col,0.7));
    g.addColorStop(0.4, b.col);
    g.addColorStop(1, darken(b.col,0.45));
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, b.r, b.r*1.18, 0, 0, Math.PI*2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.ellipse(b.x-b.r*0.26, b.y-b.r*0.32, b.r*0.22, b.r*0.16, -0.4, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fill();

    ctx.beginPath();
    let sx=b.x, sy=b.y+b.r*1.18;
    ctx.moveTo(sx,sy);
    for(let i=1;i<=16;i++){
      const ti = i*0.45;
      ctx.lineTo(sx+Math.sin(ti+b.sway*0.6)*6, sy+ti*7);
    }
    ctx.strokeStyle = darken(b.col,0.3);
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.7;
    ctx.stroke();
    ctx.globalAlpha = 1;

    const first = b.name.split(' ')[0];
    const fs = Math.max(12, Math.min(b.r*0.32, 16));
    ctx.font = `bold ${fs}px 'Poppins', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = 10;
    ctx.strokeStyle = 'rgba(0,0,0,0.8)';
    ctx.lineWidth = 4;
    ctx.strokeText(first, b.x, b.y);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.fillText(first, b.x, b.y);
    ctx.restore();
  }

  for(const p of particles){
    p.x += p.vx; p.y += p.vy; p.vy += 0.12;
    p.life -= p.decay; p.rot += p.rotv;
    if(p.life <= 0) continue;
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 15;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(0, 0, p.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  particles = particles.filter(p=>p.life>0);

  for(const cf of confetti){
    cf.x += cf.vx; cf.y += cf.vy; cf.vy += 0.14;
    cf.rot += cf.rotv; cf.life -= cf.decay;
    if(cf.life <= 0) continue;
    ctx.save();
    ctx.globalAlpha = cf.life;
    ctx.translate(cf.x, cf.y);
    ctx.rotate(cf.rot);
    ctx.shadowColor = cf.color;
    ctx.shadowBlur = 12;
    ctx.fillStyle = cf.color;
    ctx.fillRect(-cf.w/2, -cf.h/2, cf.w, cf.h);
    ctx.restore();
  }
  confetti = confetti.filter(cf=>cf.life>0);

  for(const nl of nameLabels){
    nl.x += nl.vx; nl.y += nl.vy; nl.vy += 0.02;
    nl.life -= nl.decay;
    if(nl.life <= 0) continue;
    ctx.save();
    ctx.globalAlpha = Math.min(nl.life*2.5, 1);
    ctx.font = `bold ${nl.size}px 'Poppins', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.95)';
    ctx.shadowBlur = 20;
    ctx.strokeStyle = 'rgba(0,0,0,0.9)';
    ctx.lineWidth = 6;
    ctx.strokeText(nl.name, nl.x, nl.y);
    ctx.shadowColor = nl.col;
    ctx.shadowBlur = 40;
    ctx.fillStyle = nl.col;
    ctx.fillText(nl.name, nl.x, nl.y);
    ctx.restore();
  }
  nameLabels = nameLabels.filter(nl=>nl.life>0);
}
requestAnimationFrame(draw);

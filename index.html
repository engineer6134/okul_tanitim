<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tahir Kaya İHO - Başvuru Sayacı</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            background:
                radial-gradient(circle at top left, #1b5e20 0%, transparent 30%),
                radial-gradient(circle at bottom right, #004d40 0%, transparent 30%),
                linear-gradient(135deg, #021b13, #063b2d, #0b5d48);
            min-height: 100vh;
            color: white;
            position: relative;
        }

        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: .2; transform: scale(.7); }
            50%       { opacity: 1; transform: scale(1.6); }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .card {
            width: 100%;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 35px;
            overflow: hidden;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.4),
                inset 0 0 30px rgba(255, 255, 255, 0.05);
        }

        .top {
            padding: 50px 40px;
            text-align: center;
            position: relative;
        }

        .badge {
            display: inline-block;
            padding: 10px 22px;
            background: linear-gradient(45deg, #ffd54f, #ffb300);
            color: #1b1b1b;
            border-radius: 999px;
            font-weight: 700;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .school {
            font-size: 48px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 15px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, .3);
        }

        .title {
            font-size: 28px;
            font-weight: 600;
            color: #ffe082;
            margin-bottom: 30px;
        }

        .counter-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .counter-box {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle at top, #2e7d32, #0d3d24);
            border: 10px solid rgba(255, 255, 255, .12);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow:
                0 0 40px rgba(0, 255, 150, .25),
                inset 0 0 30px rgba(255, 255, 255, .06);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50%       { transform: translateY(-10px); }
        }

        .counter-box::before {
            content: '';
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            border: 3px dashed rgba(255, 255, 255, .25);
            animation: spin 20s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .counter {
            font-size: 90px;
            font-weight: 800;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 20px rgba(255, 255, 255, .5);
            transition: transform .3s, color .2s;
        }

        .counter-text {
            margin-top: 10px;
            font-size: 22px;
            color: #ffe082;
            font-weight: 600;
        }

        .info {
            flex: 1;
            min-width: 280px;
            text-align: left;
        }

        .info-card {
            background: rgba(255, 255, 255, .08);
            padding: 25px;
            border-radius: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, .1);
            transition: .3s;
        }

        .info-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, .12);
        }

        .info-card h3 {
            color: #ffd54f;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .info-card p {
            color: #f1f1f1;
            line-height: 1.7;
        }

        .progress-section {
            margin-top: 40px;
        }

        .progress-title {
            font-size: 22px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .progress {
            width: 100%;
            height: 30px;
            background: rgba(255, 255, 255, .1);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #ffd54f, #ff9800, #ff7043);
            box-shadow: 0 0 20px rgba(255, 193, 7, .5);
            transition: width 0.8s ease;
        }

        .bottom {
            background: rgba(0, 0, 0, .18);
            padding: 30px;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            border-top: 1px solid rgba(255, 255, 255, .1);
        }

        /* Buton — <a> değil <button> ile yapıldı, tıkta sayaç artar */
        .btn {
            margin-top: 30px;
            display: inline-block;
            padding: 18px 35px;
            background: linear-gradient(45deg, #ffb300, #ff7043);
            color: white;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(255, 152, 0, .4);
            transition: .3s;
            cursor: pointer;
            border: none;
            font-family: 'Poppins', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.03);
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* +1 etiketi */
        .plus-one {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            pointer-events: none;
            opacity: 0;
            animation: riseUp 0.8s ease forwards;
        }

        @keyframes riseUp {
            0%   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            80%  { opacity: 1; transform: translate(-50%, -140%) scale(1.3); }
            100% { opacity: 0; transform: translate(-50%, -160%) scale(1.1); }
        }

        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: #00ffb3;
            filter: blur(140px);
            opacity: .18;
            top: -100px;
            right: -100px;
        }

        @media(max-width:768px) {
            .school      { font-size: 32px; }
            .title       { font-size: 20px; }
            .counter-box { width: 220px; height: 220px; }
            .counter     { font-size: 65px; }
        }
    </style>
</head>

<body>

    <div class="stars" id="stars"></div>
    <div class="glow"></div>

    <div class="container">
        <div class="card">
            <div class="top">

                <div class="badge">2026 İNGİLİZCE PROJE SINIFI</div>

                <div class="school">TAHİR KAYA<br>İMAM HATİP ORTAOKULU</div>

                <div class="title">Başvurular Yoğun İlgi Görüyor</div>

                <div class="counter-area">

                    <div class="counter-box">
                        <div class="counter" id="counter">0</div>
                        <div class="counter-text">Başvuru</div>
                    </div>

                    <div class="info">

                        <div class="info-card">
                            <h3>📌 Kontenjan</h3>
                            <p>50 kız + 50 erkek öğrenci alınacaktır.</p>
                        </div>

                        <div class="info-card">
                            <h3>📅 Sınav Tarihi</h3>
                            <p>10 Mayıs 2026 Pazar<br>Saat 10.00</p>
                        </div>

                        <div class="progress-section">
                            <div class="progress-title">Başvuru Doluluk Oranı</div>
                            <div class="progress">
                                <div class="progress-fill" id="progressFill"></div>
                            </div>
                        </div>

                        <button class="btn" id="applyBtn">Hemen Başvur</button>

                    </div>
                </div>
            </div>

            <div class="bottom">
                Tahir Kaya İHO İngilizce Proje Sınıfı Giriş Sınavı
            </div>
        </div>
    </div>

    <script>
        const FORM_URL    = "https://docs.google.com/forms/d/e/1FAIpQLSdDw3E1q6AY-wvwvXmoq5vbflJofPN-OW0UVBdFseLySR8Ntw/viewform";
        const BASE_COUNT  = 361;   // başlangıç değeri
        const KONTENJAN   = 100;   // progress bar baz
        const STORAGE_KEY = "basvuruSayisi";

        const counterEl    = document.getElementById("counter");
        const progressFill = document.getElementById("progressFill");
        const applyBtn     = document.getElementById("applyBtn");

        /* localStorage'daki ekstra tıklamalar + başlangıç değeri */
        let savedExtra = parseInt(localStorage.getItem(STORAGE_KEY) || "0");
        let count      = BASE_COUNT + savedExtra;

        /* Progress güncelle */
        function updateProgress(n) {
            const pct = Math.min((n / KONTENJAN) * 100, 100);
            progressFill.style.width = pct + "%";
        }

        /* Sayacı animasyonla göster */
        function animateTo(from, to, duration) {
            const startTime = performance.now();
            function step(now) {
                const t       = Math.min((now - startTime) / duration, 1);
                const eased   = 1 - Math.pow(1 - t, 3);
                counterEl.textContent = Math.round(from + (to - from) * eased);
                if (t < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        /* Sayfa açılışında 0'dan başlangıç değerine animasyon */
        window.addEventListener("load", () => {
            setTimeout(() => {
                animateTo(0, count, 1800);
                updateProgress(count);
            }, 300);
        });

        /* Butona tıklanınca */
        applyBtn.addEventListener("click", () => {
            const prev = count;
            count++;
            savedExtra++;
            localStorage.setItem(STORAGE_KEY, savedExtra);

            /* Sayacı güncelle */
            animateTo(prev, count, 400);
            updateProgress(count);

            /* Sayı parlar */
            counterEl.style.color     = "#b9f6ca";
            counterEl.style.textShadow = "0 0 30px rgba(100,255,180,.9)";
            setTimeout(() => {
                counterEl.style.color      = "#fff";
                counterEl.style.textShadow = "0 0 20px rgba(255,255,255,.5)";
            }, 400);

            /* Zıplama */
            counterEl.style.transform = "scale(1.25)";
            setTimeout(() => { counterEl.style.transform = "scale(1)"; }, 300);

            /* +1 etiketi */
            const plusOne = document.createElement("span");
            plusOne.className   = "plus-one";
            plusOne.textContent = "+1";
            applyBtn.appendChild(plusOne);
            setTimeout(() => plusOne.remove(), 850);

            /* Formu yeni sekmede aç */
            setTimeout(() => window.open(FORM_URL, "_blank"), 300);
        });

        /* Yıldız efekti */
        const starsEl = document.getElementById("stars");
        for (let i = 0; i < 120; i++) {
            const star = document.createElement("div");
            star.classList.add("star");
            star.style.left              = Math.random() * 100 + "%";
            star.style.top               = Math.random() * 100 + "%";
            star.style.animationDuration = (Math.random() * 3 + 2) + "s";
            star.style.opacity           = Math.random();
            starsEl.appendChild(star);
        }
    </script>

</body>
</html>

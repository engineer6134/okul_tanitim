<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎓 Mezuniyet 2025-2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0618;font-family:'Georgia',serif;}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block;}
#hud{position:fixed;top:0;left:0;width:100%;text-align:center;z-index:10;pointer-events:none;}
#school{margin-top:16px;font-size:clamp(.65em,1vw,.85em);color:#a5b4fc;letter-spacing:.2em;text-shadow:0 0 20px rgba(165,180,252,.3);font-weight:600;}
#title{font-size:clamp(1.8em,5.5vw,3.2em);font-weight:bold;background:linear-gradient(135deg,#fde047,#f472b6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px rgba(244,114,182,.4));letter-spacing:.04em;margin-top:2px;line-height:1.2;}
#hint{font-size:clamp(.7em,2vw,.85em);color:rgba(255,255,255,.5);margin-top:6px;letter-spacing:.12em;text-shadow:0 0 15px rgba(255,255,255,.1);}
#btns{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:20;background:rgba(10,6,24,.6);backdrop-filter:blur(12px);padding:8px 16px;border-radius:60px;border:1px solid rgba(255,255,255,.08);}
.cbtn{padding:8px 22px;border:1.5px solid rgba(255,255,255,.15);border-radius:40px;color:#c8d0e6;font-size:clamp(.7em,2.2vw,.9em);cursor:pointer;background:rgba(255,255,255,.04);transition:all .3s cubic-bezier(.34,1.56,.64,1);letter-spacing:.08em;white-space:nowrap;-webkit-user-select:none;user-select:none;font-weight:600;text-shadow:0 0 8px rgba(0,0,0,.5);}
.cbtn:hover{transform:scale(1.05);border-color:rgba(255,215,0,.4);}
.cbtn.on{background:linear-gradient(135deg,#fde047,#f472b6);border-color:#fde047;color:#0a0618;box-shadow:0 0 40px rgba(253,224,71,.25);font-weight:bold;text-shadow:none;}
.cbtn.on:nth-child(2){background:linear-gradient(135deg,#f472b6,#a78bfa);border-color:#f472b6;box-shadow:0 0 40px rgba(244,114,182,.3);}
.cbtn.on:nth-child(3){background:linear-gradient(135deg,#38bdf8,#2dd4bf);border-color:#38bdf8;box-shadow:0 0 40px rgba(56,189,248,.3);}
.cbtn.on:nth-child(4){background:linear-gradient(135deg,#fb923c,#f472b6);border-color:#fb923c;box-shadow:0 0 40px rgba(251,146,60,.3);}
#footer{position:fixed;bottom:4px;width:100%;text-align:center;color:rgba(255,255,255,.15);font-size:clamp(.55em,1.4vw,.65em);letter-spacing:.2em;z-index:10;pointer-events:none;font-weight:300;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="school">✦ TAHİR KAYA İMAM HATİP ORTAOKULU ✦</div>
  <div id="title">🎓 MEZUNİYET 2025–2026 🎓</div>
  <div id="hint">✨ Balonlara dokun — isimler uçsun, konfetiler patlasın! ✨</div>
</div>
<div id="btns">
  <div class="cbtn on" onclick="filterClass(0)">Tümü</div>
  <div class="cbtn" onclick="filterClass(1)">8 / A</div>
  <div class="cbtn" onclick="filterClass(2)">8 / B</div>
  <div class="cbtn" onclick="filterClass(3)">8 / C</div>
</div>
<div id="footer">✦ Hayırlı olsun sevgili mezunlar (Ali AKDOĞAN) ✦</div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let CW,CH;
function resize(){
  CW=canvas.width=window.innerWidth;
  CH=canvas.height=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

// ================================================================
// 🎨 YENİ & ÇEKİCİ RENK PALETLERİ (Neon + Pastel karışımı)
// ================================================================
const PAL = [
  // [0] Genel konfeti / yedek
  ['#FF1493', '#FF4500', '#FFD700', '#00FF7F', '#00BFFF', '#9400D3', '#FF69B4', '#7FFF00', '#FF6B6B', '#48CAE4'],
  // [1] 8-A (Pembe / Lavanta / Mor)
  ['#FF6B9D', '#C084FC', '#F472B6', '#FB7185', '#E879F9', '#F43F5E', '#F0ABFC', '#D946EF', '#F9A8D4', '#A78BFA'],
  // [2] 8-B (Mavi / Turkuaz / Yeşil / Neon)
  ['#3B82F6', '#06B6D4', '#10B981', '#F59E0B', '#6366F1', '#14B8A6', '#8B5CF6', '#2DD4BF', '#60A5FA', '#34D399'],
  // [3] 8-C (Turuncu / Kırmızı / Altın / Mor)
  ['#EC4899', '#8B5CF6', '#F59E0B', '#EF4444', '#D946EF', '#F97316', '#A855F7', '#FB923C', '#EAB308', '#F43F5E']
];

// ================================================================
// ÖĞRENCİ LİSTESİ
// ================================================================
const ALL=[
  {n:'Beyza Fazlı',c:1},{n:'Ebrar Sultan Sakarya',c:1},{n:'Eylül Çelebi',c:1},
  {n:'Ecrin Elif Savaş',c:1},{n:'Güzide Aslı Doğan',c:1},{n:'Merve Şevval Aslanhan',c:1},
  {n:'Miraç Nur Çötenoğlu',c:1},{n:'Nehir Ünsal',c:1},{n:'Rojin Çakar',c:1},
  {n:'Tuğba Özer',c:1},{n:'Zeynep Özyürek',c:1},{n:'İrem Lütfiye Nalbat',c:1},
  {n:'Betül Aydoğmuş',c:1},{n:'Vildan Kırlak',c:1},{n:'Rawan Almustafa',c:1},
  {n:'Medine Keleş',c:1},{n:'Ada Çelik',c:1},{n:'Elif Nur Siviş',c:1},
  {n:'Sevde Nur Mutlu',c:1},{n:'Yağmur Ecrin Damgacı',c:1},{n:'Hayrünnisa Polat',c:1},
  {n:'Rümeysa Koç',c:1},{n:'Ümmügülsüm Karaaslan',c:1},{n:'Gülsüm Çankal',c:1},
  {n:'Sümeyye Öztürk',c:1},{n:'Aylin Meral',c:1},{n:'Ayşenaz Işık',c:1},
  {n:'Zeynep Ecrin Şeker',c:1},{n:'Hiranur Umut',c:1},{n:'Ravza Zeynep Portakal',c:1},
  {n:'Ebrar Irmak',c:1},{n:'İmran Karakaş',c:1},
  {n:'Hamza Hammuş',c:2},{n:'Yusuf Emir Korkmaz',c:2},{n:'Yusuf Yemişli',c:2},
  {n:'Memiş Yoldaş',c:2},{n:'Mevlüt Agridağı',c:2},{n:'Berat Kanbur',c:2},
  {n:'Muhammed Fatih Altunbay',c:2},{n:'Muhammed Yusuf Erden',c:2},{n:'Sefa Duman',c:2},
  {n:'Devran Karaaslan',c:2},{n:'Ahmet İlhan Demir',c:2},{n:'Mohamad Ghaith Koshkar',c:2},
  {n:'Muhammed Yasin Oğuz',c:2},
  {n:'Asel Ada Gokmen',c:3},{n:'Duru Köseoğlu',c:3},{n:'Elif Saliha Söğütcü',c:3},
  {n:'İrem Ece Uçar',c:3},{n:'Tusem Uğurlu',c:3},{n:'Zehra Eroğlu',c:3},
  {n:'Anıl Kayra Akpınar',c:3},{n:'Giray Yıldız',c:3},{n:'Mesut Taş',c:3},
  {n:'Haktan Tayfun Tarhan',c:3},{n:'Zeynep Hazal Özdemir',c:3},{n:'Selim Yartaşı',c:3},
  {n:'Yavuz Efe Çolak',c:3},{n:'Yakup Gezer',c:3},{n:'Yusuf Gezer',c:3},
  {n:'Ecrin Nisanur Yılmaz',c:3},{n:'Elif Naz Özgün',c:3},{n:'Zehra Pınar Karaca',c:3},
  {n:'İlknur Gedik',c:3}
];

// ================================================================
// YARDIMCI FONKSİYONLAR
// ================================================================
function lighten(hex,amt){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,Math.round(r+(255-r)*amt))},${Math.min(255,Math.round(g+(255-g)*amt))},${Math.min(255,Math.round(b+(255-b)*amt))})`;
}
function darken(hex,amt){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.round(r*(1-amt))},${Math.round(g*(1-amt))},${Math.round(b*(1-amt))})`;
}
function isMobile(){return Math.min(CW,CH)<600;}

let balloons=[],particles=[],nameLabels=[],confetti=[],stars=[];

// ================================================================
// YILDIZLAR
// ================================================================
for(let i=0;i<150;i++) stars.push({x:Math.random(),y:Math.random()*.7,r:Math.random()*1.8+.3,t:Math.random()*Math.PI*2,s:Math.random()*.04+.008});

// ================================================================
// BALON OLUŞTUR
// ================================================================
function makeBalloon(s,idx,total){
  const pal=PAL[s.c];
  const col=pal[Math.floor(Math.random()*pal.length)];
  const mobile=isMobile();
  const minR=mobile?30:38, maxR=mobile?20:26;
  const r=minR+Math.random()*maxR;
  const cols=Math.max(3,Math.ceil(Math.sqrt(total)));
  const c2=idx%cols;
  const startX=(c2+.5)*(CW/cols)+(Math.random()*50-25);
  const row=Math.floor(idx/cols);
  return {
    x:Math.max(r+5,Math.min(CW-r-5,startX)),
    y:CH+r+row*100+Math.random()*60,
    vy:-(mobile?.5+Math.random()*.45:.55+Math.random()*.5),
    vx:(Math.random()-.5)*.6,
    sway:Math.random()*Math.PI*2,
    swaySpd:.012+Math.random()*.014,
    r,col,name:s.n,cls:s.c,
    popped:false,popAlpha:1,
    born:performance.now(),delay:idx*90
  };
}

function init(filter){
  balloons=[];nameLabels=[];particles=[];confetti=[];
  const list=filter===0?ALL:ALL.filter(s=>s.c===filter);
  list.forEach((s,i)=>balloons.push(makeBalloon(s,i,list.length)));
}
init(0);

window.filterClass=function(f){
  document.querySelectorAll('.cbtn').forEach((b,i)=>b.classList.toggle('on',i===f));
  init(f);
};

// ================================================================
// PATLATMA (POP) FONKSİYONU
// ================================================================
function popBalloon(b){
  if(b.popped)return;
  b.popped=true;
  const mobile=isMobile();
  const count=mobile?28:38;
  // Partiküller
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,spd=2.5+Math.random()*6;
    particles.push({x:b.x,y:b.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-2.5,r:2.8+Math.random()*5.5,color:b.col,life:1,decay:.015+Math.random()*.015,rot:Math.random()*Math.PI*2,rotv:(Math.random()-.5)*.25});
  }
  // Konfeti
  for(let i=0;i<(mobile?12:18);i++){
    confetti.push({x:b.x,y:b.y,vx:(Math.random()-.5)*12,vy:-(Math.random()*8+4),color:PAL[0][Math.floor(Math.random()*PAL[0].length)],w:8+Math.random()*12,h:4+Math.random()*6,rot:Math.random()*Math.PI*2,rotv:(Math.random()-.5)*.4,life:1,decay:.008});
  }
  // İsim etiketi
  nameLabels.push({
    name:b.name,x:b.x,y:b.y-b.r,
    vx:(Math.random()-.5)*1.2,vy:-(1.8+Math.random()*1.2),
    life:1,decay:.0042,
    size:Math.max(mobile?16:18,Math.min(b.r*.4,mobile?20:26)),
    col:b.col
  });
}

// ================================================================
// DOKUNMA / TIKLAMA YÖNETİMİ
// ================================================================
function getPos(e){
  const rect=canvas.getBoundingClientRect();
  const scaleX=CW/rect.width, scaleY=CH/rect.height;
  if(e.touches&&e.touches.length>0){
    return {x:(e.touches[0].clientX-rect.left)*scaleX,y:(e.touches[0].clientY-rect.top)*scaleY};
  }
  return {x:(e.clientX-rect.left)*scaleX,y:(e.clientY-rect.top)*scaleY};
}

function handleTap(e){
  e.preventDefault();
  const {x,y}=getPos(e);
  for(const b of balloons){
    if(b.popped)continue;
    const dx=b.x-x,dy=b.y-y;
    if(Math.sqrt(dx*dx+dy*dy)<b.r+16){popBalloon(b);break;}
  }
}

canvas.addEventListener('click',handleTap);
canvas.addEventListener('touchstart',handleTap,{passive:false});
canvas.addEventListener('mousemove',e=>{
  const {x,y}=getPos(e);
  let hit=false;
  for(const b of balloons){if(!b.popped){const dx=b.x-x,dy=b.y-y;if(Math.sqrt(dx*dx+dy*dy)<b.r+14){hit=true;break;}}}
  canvas.style.cursor=hit?'pointer':'default';
});

// ================================================================
// RASGELE OTOMATİK PATLATMA (DAHA CANLI)
// ================================================================
setInterval(()=>{
  const live=balloons.filter(b=>!b.popped&&b.y<CH+80&&b.y>-50);
  if(live.length>0)popBalloon(live[Math.floor(Math.random()*Math.min(live.length,5))]);
},1000);

// ================================================================
// 🎨 ÇİZİM DÖNGÜSÜ (RENDER LOOP)
// ================================================================
function draw(now){
  requestAnimationFrame(draw);

  // --- ARKA PLAN (Degrade Gece Gökyüzü) ---
  const grad=ctx.createRadialGradient(CW*.5, CH*1.2, 0, CW*.5, CH*1.2, CH*1.5);
  grad.addColorStop(0, '#2e1065');   // koyu mor
  grad.addColorStop(0.4, '#1e1b4b'); // lacivert
  grad.addColorStop(0.8, '#0f0a2a'); // koyu lacivert
  grad.addColorStop(1, '#05020a');   // siyah
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,CW,CH);

  // --- YILDIZLAR (Işıltılı) ---
  for(const s of stars){
    s.t+=s.s;
    const alpha=0.3+0.7*(0.5+0.5*Math.sin(s.t));
    ctx.save();ctx.globalAlpha=alpha;
    ctx.shadowColor='rgba(255,255,255,0.5)';ctx.shadowBlur=8;
    ctx.fillStyle='#fff';ctx.beginPath();
    ctx.arc(s.x*CW,s.y*CH,s.r,0,Math.PI*2);ctx.fill();ctx.restore();
  }

  // --- BALONLAR ---
  for(const b of balloons){
    if(b.delay&&now-b.born<b.delay)continue;
    if(b.popped){
      b.popAlpha-=.015;
      if(b.popAlpha<=0)continue;
      ctx.save();ctx.globalAlpha=b.popAlpha*.4;
      ctx.shadowColor=b.col;ctx.shadowBlur=20;
      ctx.strokeStyle=b.col;ctx.lineWidth=2;
      for(let i=0;i<10;i++){const a=(i/10)*Math.PI*2;ctx.beginPath();ctx.moveTo(b.x+Math.cos(a)*b.r*.7,b.y+Math.sin(a)*b.r*.7);ctx.lineTo(b.x+Math.cos(a)*b.r*1.8,b.y+Math.sin(a)*b.r*1.8);ctx.stroke();}
      ctx.restore();continue;
    }
    b.sway+=b.swaySpd;
    b.x+=b.vx+Math.sin(b.sway)*.55;
    b.y+=b.vy;
    if(b.x<b.r+2)b.vx=Math.abs(b.vx);
    if(b.x>CW-b.r-2)b.vx=-Math.abs(b.vx);
    if(b.y<-b.r*6){b.y=CH+b.r+Math.random()*150;b.x=Math.max(b.r+5,Math.min(CW-b.r-5,Math.random()*CW));}

    // Balon gölgesi
    ctx.save();
    ctx.shadowColor=b.col;ctx.shadowBlur=25;

    // Gövde
    const g=ctx.createRadialGradient(b.x-b.r*.3,b.y-b.r*.35,b.r*.05,b.x,b.y,b.r);
    g.addColorStop(0,lighten(b.col,.7));g.addColorStop(.4,b.col);g.addColorStop(1,darken(b.col,.45));
    ctx.beginPath();ctx.ellipse(b.x,b.y,b.r,b.r*1.18,0,0,Math.PI*2);
    ctx.fillStyle=g;ctx.fill();
    ctx.shadowBlur=0;

    // Parlak vurgu
    ctx.beginPath();ctx.ellipse(b.x-b.r*.26,b.y-b.r*.32,b.r*.22,b.r*.16,-.4,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.fill();

    // İp
    ctx.beginPath();
    let sx=b.x,sy=b.y+b.r*1.18;
    ctx.moveTo(sx,sy);
    for(let i=1;i<=16;i++){const ti=i*.45;ctx.lineTo(sx+Math.sin(ti+b.sway*.6)*6,sy+ti*7);}
    ctx.strokeStyle=darken(b.col,.3);ctx.lineWidth=1.5;ctx.globalAlpha=.7;ctx.stroke();
    ctx.globalAlpha=1;

    // İSİM (Sadece ilk isim, büyük ve okunaklı)
    const first=b.name.split(' ')[0];
    const fs=Math.max(12,Math.min(b.r*.32,16));
    ctx.font=`bold ${fs}px Georgia, serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=10;
    ctx.strokeStyle='rgba(0,0,0,.8)';ctx.lineWidth=4;ctx.strokeText(first,b.x,b.y);
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.fillText(first,b.x,b.y);
    ctx.restore();
  }

  // --- PARTİKÜLLER (Patlama ışıltıları) ---
  for(const p of particles){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life-=p.decay;p.rot+=p.rotv;
    if(p.life<=0)continue;
    ctx.save();ctx.globalAlpha=p.life;ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.shadowColor=p.color;ctx.shadowBlur=15;
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  particles=particles.filter(p=>p.life>0);

  // --- KONFETİLER ---
  for(const cf of confetti){
    cf.x+=cf.vx;cf.y+=cf.vy;cf.vy+=.14;cf.rot+=cf.rotv;cf.life-=cf.decay;
    if(cf.life<=0)continue;
    ctx.save();ctx.globalAlpha=cf.life;ctx.translate(cf.x,cf.y);ctx.rotate(cf.rot);
    ctx.shadowColor=cf.color;ctx.shadowBlur=12;
    ctx.fillStyle=cf.color;ctx.fillRect(-cf.w/2,-cf.h/2,cf.w,cf.h);ctx.restore();
  }
  confetti=confetti.filter(cf=>cf.life>0);

  // --- İSİM ETİKETLERİ (Düşen isimler) ---
  for(const nl of nameLabels){
    nl.x+=nl.vx;nl.y+=nl.vy;nl.vy+=.02;nl.life-=nl.decay;
    if(nl.life<=0)continue;
    ctx.save();ctx.globalAlpha=Math.min(nl.life*2.5,1);
    ctx.font=`bold ${nl.size}px Georgia, serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='rgba(0,0,0,.95)';ctx.shadowBlur=20;
    ctx.strokeStyle='rgba(0,0,0,.9)';ctx.lineWidth=6;ctx.strokeText(nl.name,nl.x,nl.y);
    ctx.shadowColor=nl.col;ctx.shadowBlur=40;
    ctx.fillStyle=nl.col;ctx.fillText(nl.name,nl.x,nl.y);ctx.restore();
  }
  nameLabels=nameLabels.filter(nl=>nl.life>0);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
